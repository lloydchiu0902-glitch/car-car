<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚗 藍牙循跡車 APP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        button { touch-action: manipulation; }
        .log-box { font-family: monospace; font-size: 0.85rem; }
        /* 隱藏預設檔案上傳按鈕，使用自訂按鈕 */
        input[type="file"] { display: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-10">

    <!-- 頂部導航與連線狀態 -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold">🚗 藍牙控制面板</h1>
        <button id="connectBtn" class="bg-white text-blue-600 px-4 py-1 rounded font-bold shadow active:bg-blue-100 transition">
            連線藍牙
        </button>
    </header>

    <div class="px-4 mt-2">
        <p id="statusText" class="text-sm text-red-500 font-bold text-right mt-1">狀態: 未連線</p>
    </div>

    <!-- 🗺️ 地圖與自動路徑規劃區 -->
    <section class="m-4 bg-yellow-50 p-4 rounded-xl shadow-sm border-l-4 border-yellow-500">
        <h2 class="text-lg font-bold mb-3 border-b border-yellow-200 pb-2">🗺️ 自動路徑規劃 (匯入 CSV)</h2>
        
        <div class="mb-3">
            <label class="bg-yellow-500 text-white px-4 py-2 rounded font-bold shadow cursor-pointer active:bg-yellow-600 inline-block w-full text-center">
                📁 點此匯入 maze.csv 檔案
                <input type="file" id="csvFileInput" accept=".csv">
            </label>
            <p id="csvStatus" class="text-xs text-gray-500 mt-1 text-center">尚未匯入地圖資料</p>
        </div>

        <div class="grid grid-cols-2 gap-2 text-sm mb-3">
            <div>
                <label class="font-bold text-gray-700 block">起點 Node:</label>
                <input type="number" id="startNode" value="1" class="border rounded px-2 py-1 w-full">
            </div>
            <div>
                <label class="font-bold text-gray-700 block">初始方向:</label>
                <select id="initialDir" class="border rounded px-2 py-1 w-full">
                    <option value="0">北 (0)</option>
                    <option value="1">東 (1)</option>
                    <option value="2">南 (2)</option>
                    <option value="3" selected>西 (3)</option>
                </select>
            </div>
            <div class="col-span-2">
                <label class="font-bold text-gray-700 block">獎品 Nodes (用逗號隔開):</label>
                <input type="text" id="prizeNodes" value="1,6,12,13,16,22,34,43,46,47" class="border rounded px-2 py-1 w-full">
            </div>
            <div class="col-span-2">
                <label class="font-bold text-gray-700 block">總步數 (Total Steps):</label>
                <input type="number" id="totalSteps" value="80" class="border rounded px-2 py-1 w-full">
            </div>
        </div>

        <button onclick="calculateAutoPath()" class="bg-slate-800 text-white px-4 py-2 rounded font-bold shadow active:bg-slate-900 w-full mb-2">
            🚀 計算最佳路徑與指令
        </button>
        
        <div id="pathResult" class="hidden bg-white p-2 rounded text-sm text-gray-700 border border-yellow-200">
            <p class="font-bold text-blue-600">最高分: <span id="scoreOut">0</span></p>
            <p class="mt-1 font-bold">路徑: <span id="pathOut" class="font-normal text-xs"></span></p>
            <p class="mt-1 font-bold text-green-600">產出指令 (已同步至下方輸入框):</p>
            <p id="cmdOut" class="font-mono text-xs break-all bg-gray-100 p-1 rounded"></p>
        </div>
    </section>

    <!-- 動作控制區 -->
    <section class="m-4 bg-white p-4 rounded-xl shadow-sm">
        <h2 class="text-lg font-bold mb-3 border-b pb-2">🎮 單步動作控制</h2>
        <div class="grid grid-cols-3 gap-3 text-center">
            <div></div>
            <button onclick="sendCmd('F')" class="bg-blue-500 text-white p-4 rounded-lg shadow active:bg-blue-700 text-xl font-bold">直走<br>F</button>
            <div></div>
            
            <button onclick="sendCmd('L')" class="bg-blue-500 text-white p-4 rounded-lg shadow active:bg-blue-700 text-xl font-bold">左轉<br>L</button>
            <button onclick="sendCmd('S')" class="bg-green-500 text-white p-4 rounded-lg shadow active:bg-green-700 text-xl font-bold">掃描<br>S</button>
            <button onclick="sendCmd('R')" class="bg-blue-500 text-white p-4 rounded-lg shadow active:bg-blue-700 text-xl font-bold">右轉<br>R</button>
            
            <div></div>
            <button onclick="sendCmd('U')" class="bg-purple-500 text-white p-4 rounded-lg shadow active:bg-purple-700 text-xl font-bold">迴轉<br>U</button>
            <button onclick="sendCmd('C')" class="bg-red-500 text-white p-4 rounded-lg shadow active:bg-red-700 text-xl font-bold">清空<br>C</button>
        </div>

        <div class="mt-4 mt-4">
            <h3 class="text-sm font-bold text-gray-600 mb-1">連續指令 (如 FFLRUS):</h3>
            <div class="flex gap-2">
                <input type="text" id="seqInput" class="border rounded px-3 py-2 flex-1 text-lg uppercase font-mono" placeholder="輸入指令...">
                <button onclick="sendSeq()" class="bg-slate-700 text-white px-4 rounded font-bold shadow">送出</button>
            </div>
        </div>
    </section>

    <!-- RFID 顯示區 -->
    <section class="m-4 bg-white p-4 rounded-xl shadow-sm border-l-4 border-green-500">
        <h2 class="text-lg font-bold mb-2">📡 RFID 儀表板</h2>
        <p class="text-gray-600 text-sm mb-1" id="rfidCount">總掃描次數: 0</p>
        <p class="text-2xl font-bold text-blue-600 mb-3" id="rfidLatest">最新: (無)</p>
        <div id="rfidList" class="bg-slate-50 border p-2 rounded h-32 overflow-y-auto log-box">
            <!-- 歷史紀錄 -->
        </div>
    </section>

    <!-- 參數調整區 -->
    <section class="m-4 bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
        <h2 class="text-lg font-bold mb-3 border-b pb-2">⚙️ 參數調整</h2>
        
        <div class="grid grid-cols-2 gap-4">
            <!-- PID 區 -->
            <div>
                <h3 class="font-bold text-sm text-gray-500 mb-2">PID 設定</h3>
                <div class="flex items-center mb-2">
                    <span class="w-8 font-bold">Kp:</span>
                    <input type="number" id="inpP" value="24.0" class="border rounded px-2 py-1 w-16 mr-2">
                    <button onclick="sendParam('P', 'inpP')" class="bg-gray-200 px-2 py-1 rounded text-sm shadow-sm active:bg-gray-300">設定</button>
                </div>
                <div class="flex items-center mb-2">
                    <span class="w-8 font-bold">Ki:</span>
                    <input type="number" id="inpI" value="0.0" class="border rounded px-2 py-1 w-16 mr-2">
                    <button onclick="sendParam('I', 'inpI')" class="bg-gray-200 px-2 py-1 rounded text-sm shadow-sm active:bg-gray-300">設定</button>
                </div>
                <div class="flex items-center mb-2">
                    <span class="w-8 font-bold">Kd:</span>
                    <input type="number" id="inpD" value="140.0" class="border rounded px-2 py-1 w-16 mr-2">
                    <button onclick="sendParam('D', 'inpD')" class="bg-gray-200 px-2 py-1 rounded text-sm shadow-sm active:bg-gray-300">設定</button>
                </div>
            </div>
            
            <!-- 轉彎延遲區 -->
            <div>
                <h3 class="font-bold text-sm text-gray-500 mb-2">轉彎延遲 (ms)</h3>
                <div class="flex items-center mb-2">
                    <span class="w-8 font-bold">左(X):</span>
                    <input type="number" id="inpX" value="325" class="border rounded px-2 py-1 w-16 mr-2">
                    <button onclick="sendParam('X', 'inpX')" class="bg-gray-200 px-2 py-1 rounded text-sm shadow-sm active:bg-gray-300">設定</button>
                </div>
                <div class="flex items-center mb-2">
                    <span class="w-8 font-bold">右(Y):</span>
                    <input type="number" id="inpY" value="425" class="border rounded px-2 py-1 w-16 mr-2">
                    <button onclick="sendParam('Y', 'inpY')" class="bg-gray-200 px-2 py-1 rounded text-sm shadow-sm active:bg-gray-300">設定</button>
                </div>
                <div class="flex items-center mb-2">
                    <span class="w-8 font-bold">迴(Z):</span>
                    <input type="number" id="inpZ" value="605" class="border rounded px-2 py-1 w-16 mr-2">
                    <button onclick="sendParam('Z', 'inpZ')" class="bg-gray-200 px-2 py-1 rounded text-sm shadow-sm active:bg-gray-300">設定</button>
                </div>
            </div>
        </div>
    </section>

    <!-- 通訊日誌區 -->
    <section class="m-4 bg-white p-4 rounded-xl shadow-sm">
        <h2 class="text-lg font-bold mb-2">📜 通訊日誌</h2>
        <div id="sysLog" class="bg-slate-800 text-green-400 p-2 rounded h-40 overflow-y-auto log-box break-all">
            等待連線...<br>
        </div>
    </section>

    <script>
        // ==========================================
        // 地圖與演算法變數區 (由 Python 翻譯)
        // ==========================================
        let mazeDataRows = []; 
        let num_nodes = 0;
        let num_prizes = 0;
        let all_prizes_mask = 0;
        let adj = {};
        let prize_val = {};
        let prize_bit = {};
        let id_to_coord = {};
        let memo = {};
        let best_next = {};

        // 處理 CSV 讀取
        document.getElementById('csvFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                let text = evt.target.result;
                parseCSV(text);
                document.getElementById('csvStatus').innerText = `✅ 已載入: ${file.name} (共 ${mazeDataRows.length} 個節點)`;
                document.getElementById('csvStatus').className = "text-xs text-green-600 mt-1 text-center font-bold";
            };
            reader.readAsText(file);
        });

        function parseCSV(text) {
            mazeDataRows = [];
            // 處理 BOM 和換行
            text = text.replace(/^\uFEFF/, ""); 
            let lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
            if (lines.length < 2) return;
            
            let headers = lines[0].split(",");
            for (let i = 1; i < lines.length; i++) {
                let values = lines[i].split(",");
                let rowObj = {};
                for (let j = 0; j < headers.length; j++) {
                    let key = headers[j].trim();
                    rowObj[key] = values[j] ? values[j].trim() : "";
                }
                if (rowObj["index"] !== "") {
                    mazeDataRows.append(rowObj);
                }
            }
        }

        function build_graph(start_node, prize_nodes) {
            num_nodes = 0;
            num_prizes = 0;
            all_prizes_mask = 0;
            adj = {};
            prize_val = {};
            prize_bit = {};
            id_to_coord = {};
            memo = {};
            best_next = {};

            let node_ids = mazeDataRows.map(r => parseInt(r["index"]));
            num_nodes = node_ids.length;

            node_ids.forEach(u => adj[u] = []);
            const directions = ["North", "South", "West", "East"];

            mazeDataRows.forEach(row => {
                let u = parseInt(row["index"]);
                directions.forEach(d => {
                    let val = row[d];
                    if (val !== "") {
                        adj[u].push(parseInt(parseFloat(val)));
                    }
                });
            });

            let row_map = {};
            mazeDataRows.forEach(row => row_map[parseInt(row["index"])] = row);

            id_to_coord[start_node] = {r: 0, c: 0};
            let q = [start_node];
            const mapping = { "North": {dr:-1, dc:0}, "South": {dr:1, dc:0}, "West": {dr:0, dc:-1}, "East": {dr:0, dc:1} };

            while (q.length > 0) {
                let u = q.shift();
                let r = id_to_coord[u].r;
                let c = id_to_coord[u].c;
                let row = row_map[u];

                for (let d in mapping) {
                    let val = row[d];
                    if (val === "") continue;
                    let v = parseInt(parseFloat(val));
                    if (!(v in id_to_coord)) {
                        id_to_coord[v] = { r: r + mapping[d].dr, c: c + mapping[d].dc };
                        q.push(v);
                    }
                }
            }

            node_ids.forEach(u => { prize_val[u] = 0; prize_bit[u] = -1; });

            let sr = id_to_coord[start_node].r;
            let sc = id_to_coord[start_node].c;

            prize_nodes.forEach(node => {
                if (id_to_coord[node]) {
                    let dist = Math.abs(id_to_coord[node].r - sr) + Math.abs(id_to_coord[node].c - sc);
                    prize_val[node] = dist * 10;
                    prize_bit[node] = num_prizes;
                    num_prizes++;
                }
            });

            all_prizes_mask = (1 << num_prizes) - 1;
        }

        function dfs(u, k, state) {
            if (k === 0) return 0;
            if (state === all_prizes_mask) return 0;
            let stateKey = `${u},${k},${state}`;
            if (stateKey in memo) return memo[stateKey];

            let max_future_score = 0;
            let best_v = -1;

            for (let i = 0; i < adj[u].length; i++) {
                let next_node = adj[u][i];
                let next_state = state;
                let gained_score = 0;
                let bit = prize_bit[next_node];

                if (bit !== -1 && !(state & (1 << bit))) {
                    next_state |= (1 << bit);
                    gained_score = prize_val[next_node];
                }

                let future_score = dfs(next_node, k - 1, next_state);

                if (gained_score + future_score >= max_future_score) {
                    max_future_score = gained_score + future_score;
                    best_v = next_node;
                }
            }

            best_next[stateKey] = best_v;
            memo[stateKey] = max_future_score;
            return max_future_score;
        }

        function calculateAutoPath() {
            if (mazeDataRows.length === 0) {
                alert("請先匯入 CSV 地圖檔！");
                return;
            }

            // 讀取 UI 設定
            let startNode = parseInt(document.getElementById('startNode').value);
            let initDir = parseInt(document.getElementById('initialDir').value);
            let totalSteps = parseInt(document.getElementById('totalSteps').value);
            let pStr = document.getElementById('prizeNodes').value;
            let prizeNodes = pStr.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));

            try {
                // 1. 建立地圖圖論
                build_graph(startNode, prizeNodes);
                // 2. 跑 DFS 找出最佳解
                let max_score = dfs(startNode, totalSteps, 0);

                // 3. 還原路徑
                let curr = startNode;
                let k = totalSteps;
                let state = 0;
                let path = [curr];

                while (k > 0) {
                    if (state === all_prizes_mask) break;
                    let stateKey = `${curr},${k},${state}`;
                    if (!(stateKey in best_next)) break;
                    
                    let nxt = best_next[stateKey];
                    if (nxt === -1) break;

                    path.push(nxt);
                    let bit = prize_bit[nxt];
                    if (bit !== -1 && !(state & (1 << bit))) {
                        state |= (1 << bit);
                    }
                    curr = nxt;
                    k--;
                }

                // 4. 轉換為字元指令
                let car_commands = "";
                let current_dir = initDir;
                let sim_state = 0;

                for (let i = 0; i < path.length - 1; i++) {
                    let u = path[i];
                    let v = path[i + 1];
                    let r1 = id_to_coord[u].r; let c1 = id_to_coord[u].c;
                    let r2 = id_to_coord[v].r; let c2 = id_to_coord[v].c;

                    let target_dir = -1;
                    if (r2 < r1) target_dir = 0;
                    else if (c2 > c1) target_dir = 1;
                    else if (r2 > r1) target_dir = 2;
                    else if (c2 < c1) target_dir = 3;

                    let turn = (target_dir - current_dir + 4) % 4;

                    if (turn === 0) car_commands += "F";
                    else if (turn === 1) car_commands += "R";
                    else if (turn === 2) car_commands += "U";
                    else if (turn === 3) car_commands += "L";

                    let bit = prize_bit[v];
                    if (bit !== -1 && !(sim_state & (1 << bit))) {
                        car_commands += "S";
                        sim_state |= (1 << bit);
                    }

                    current_dir = target_dir;
                }

                // 更新 UI
                document.getElementById('pathResult').classList.remove('hidden');
                document.getElementById('scoreOut').innerText = max_score;
                document.getElementById('pathOut').innerText = path.join(" ➔ ");
                document.getElementById('cmdOut').innerText = car_commands || "(無)";
                
                // 自動將指令填入發送框
                document.getElementById('seqInput').value = car_commands;

                logMsg("✅ 成功計算最佳路徑並轉為指令！", "SYS");

            } catch (err) {
                alert("計算過程發生錯誤，請確認輸入參數是否與 CSV 匹配。錯誤訊息: " + err);
            }
        }


        // ==========================================
        // 藍牙通訊與車輛控制區
        // ==========================================
        const SERVICE_UUID = '0000ffe0-0000-1000-8000-00805f9b34fb';
        const CHARACTERISTIC_UUID = '0000ffe1-0000-1000-8000-00805f9b34fb';

        let bluetoothDevice;
        let gattCharacteristic;
        let receiveBuffer = "";
        
        let rfidRecords = [];

        const connectBtn = document.getElementById('connectBtn');
        const statusText = document.getElementById('statusText');
        const sysLog = document.getElementById('sysLog');
        const rfidCountEl = document.getElementById('rfidCount');
        const rfidLatestEl = document.getElementById('rfidLatest');
        const rfidListEl = document.getElementById('rfidList');

        function logMsg(msg, type="SYS") {
            const time = new Date().toLocaleTimeString();
            let prefix = "⚙️ [SYS]";
            let color = "text-gray-400";
            if (type === "TX") { prefix = "📤 [TX]"; color = "text-blue-400"; }
            else if (type === "RX") { prefix = "📥 [RX]"; color = "text-green-400"; }
            else if (type === "ERR") { prefix = "❌ [ERR]"; color = "text-red-400"; }

            sysLog.innerHTML += `<span class="${color}">${time} ${prefix} ${msg}</span><br>`;
            sysLog.scrollTop = sysLog.scrollHeight;
        }

        // --- 藍牙核心功能 ---
        connectBtn.addEventListener('click', async () => {
            if (gattCharacteristic) {
                disconnect();
                return;
            }

            try {
                logMsg("正在請求藍牙裝置...", "SYS");
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }],
                    optionalServices: [SERVICE_UUID]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

                logMsg("連接 GATT 伺服器...", "SYS");
                statusText.innerText = "狀態: 連線中...";
                statusText.className = "text-sm font-bold text-yellow-500 text-right mt-1";

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                gattCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                // 啟動接收通知
                await gattCharacteristic.startNotifications();
                gattCharacteristic.addEventListener('characteristicvaluechanged', handleReceive);

                logMsg("✅ 連線成功！", "SYS");
                statusText.innerText = "狀態: 🟢 已連線";
                statusText.className = "text-sm font-bold text-green-500 text-right mt-1";
                connectBtn.innerText = "斷開連線";
                connectBtn.className = "bg-red-500 text-white px-4 py-1 rounded font-bold shadow active:bg-red-600 transition";

            } catch (error) {
                logMsg("連線失敗: " + error, "ERR");
                statusText.innerText = "狀態: 未連線";
                statusText.className = "text-sm font-bold text-red-500 text-right mt-1";
            }
        });

        function disconnect() {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
            }
        }

        function onDisconnected() {
            logMsg("⚠️ 藍牙已斷開", "SYS");
            gattCharacteristic = null;
            statusText.innerText = "狀態: 未連線";
            statusText.className = "text-sm font-bold text-red-500 text-right mt-1";
            connectBtn.innerText = "連線藍牙";
            connectBtn.className = "bg-white text-blue-600 px-4 py-1 rounded font-bold shadow active:bg-blue-100 transition";
        }

        // 發送指令
        async function sendData(dataStr) {
            if (!gattCharacteristic) {
                alert("請先連線藍牙！");
                return;
            }
            try {
                const encoder = new TextEncoder();
                // 若字串很長，可以考慮分段發送，但 80步通常在 20 bytes 以內，或由底層自動切分
                // 如果遇到長度超過發送失敗，可將字串每 20 個字元切成陣列用 for loop 傳送
                await gattCharacteristic.writeValue(encoder.encode(dataStr));
                logMsg(dataStr, "TX");
            } catch (error) {
                logMsg("發送失敗: " + error, "ERR");
            }
        }

        // 接收藍牙資料處理
        function handleReceive(event) {
            const decoder = new TextDecoder('utf-8');
            const value = decoder.decode(event.target.value);
            receiveBuffer += value;

            let lines = receiveBuffer.split(/\r?\n/);
            receiveBuffer = lines.pop();

            for (let line of lines) {
                if (line.trim() !== "") {
                    processIncomingMessage(line.trim());
                }
            }
        }

        function processIncomingMessage(msg) {
            if (msg.startsWith("UID:")) {
                const uid = msg.split(":")[1];
                updateRFID(uid);
                logMsg(`掃描到卡片: ${uid}`, "SYS");
            } else {
                logMsg(msg, "RX");
            }
        }

        // --- 功能按鍵事件 ---
        function sendCmd(cmd) {
            sendData(cmd);
            if (cmd === 'C') {
                clearRFID();
            }
        }

        function sendSeq() {
            let seq = document.getElementById('seqInput').value.trim().toUpperCase();
            if (!seq) return;
            
            const valid = /^[LRUFSC]+$/.test(seq);
            if (!valid) {
                alert("指令只能包含 L, R, U, F, S, C！");
                return;
            }
            
            // 分段發送，防止 HM-10 緩衝區溢位 (每段 20 字元)
            sendLongString(seq);
            
            document.getElementById('seqInput').value = "";
            if (seq.includes('C')) clearRFID();
        }
        
        async function sendLongString(str) {
            for (let i = 0; i < str.length; i += 15) {
                let chunk = str.substring(i, i + 15);
                await sendData(chunk);
                await new Promise(r => setTimeout(r, 100)); // 稍等 100ms 避免藍牙塞車
            }
        }

        function sendParam(param, inputId) {
            const val = document.getElementById(inputId).value;
            if (val === "") return;
            sendData(param + val);
        }

        // --- RFID 儀表板更新 ---
        function updateRFID(uid) {
            rfidRecords.push(uid);
            rfidCountEl.innerText = `總掃描次數: ${rfidRecords.length}`;
            rfidLatestEl.innerText = `最新: ${uid}`;
            
            rfidListEl.innerHTML += `<div class="border-b border-slate-200 py-1">#${rfidRecords.length} - UID: ${uid}</div>`;
            rfidListEl.scrollTop = rfidListEl.scrollHeight;
        }

        function clearRFID() {
            rfidRecords = [];
            rfidCountEl.innerText = `總掃描次數: 0`;
            rfidLatestEl.innerText = `最新: (無)`;
            rfidListEl.innerHTML = "";
        }
    </script>
</body>
</html>
